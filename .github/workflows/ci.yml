# CONTINUOUS INTEGRATION
# What: on every push and pull request, compile the project, run all 134 tests against a real PostgreSQL 16,
#       enforce the coverage gate, and publish the coverage report and the built jar.
# Why it matters: the tests only prove something if they run on a machine that is not yours. This workflow is
#       what turns "it works here" into "it works from a clean checkout".
#
# The integration tests (*IT) start their own postgres:16-alpine via Testcontainers, so no database service
# needs declaring below: ubuntu-latest runners already have Docker. That is also why these tests exercise the
# real triggers and row locks rather than a stand-in (see src/main/resources/db/migration/V1__ledger_schema.sql).
name: CI

on:
  push:
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run instead of queueing behind it, so feedback stays
# fast and the minutes are not spent on results nobody is waiting for any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build, test and check coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install Java 21 and cache the Maven repository, so later runs skip re-downloading Spring.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` is the whole pipeline in one command:
      #   compile -> unit tests (surefire, *Test) -> integration tests (failsafe, *IT, real Postgres)
      #   -> merge coverage data -> write the report -> FAIL if payout or ledger drops below 90%.
      # -B is batch mode (no interactive prompts, cleaner logs).
      - name: Build, test and enforce coverage
        run: mvn -B verify
        env:
          # Point Testcontainers straight at the runner's Docker socket.
          #
          # Without this, Testcontainers tries its Docker Desktop strategy first, that strategy throws a
          # NullPointerException on this runner (getSocketPath() returns null), and the exception aborts the
          # whole discovery chain BEFORE the plain Unix-socket strategy is ever tried — even though the
          # socket is right there and works. Setting DOCKER_HOST makes the environment-variable strategy
          # match first, so discovery succeeds and never reaches the broken one.
          #
          # The second half of that bug is the Testcontainers version itself; see pom.xml.
          DOCKER_HOST: unix:///var/run/docker.sock

      # Written even when the step above failed, because a failed run is when the numbers are most useful.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn

      # The test XML, so a failure can be read without scrolling the log.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn

      # Print the coverage of the two packages the résumé makes a claim about straight into the run summary,
      # so the number is visible without downloading anything.
      - name: Summarise coverage
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "No coverage report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Coverage"
            echo
            echo "| Package | Instructions | Lines |"
            echo "|---|---|---|"
            # Sum the per-class rows into per-package totals with awk, then print covered/(covered+missed).
            awk -F, 'NR>1 {im[$2]+=$4; ic[$2]+=$5; lm[$2]+=$8; lc[$2]+=$9}
                     END {for (p in ic)
                            printf "| %s | %.1f%% | %.1f%% |\n", p,
                                   100*ic[p]/(ic[p]+im[p]), 100*lc[p]/(lc[p]+lm[p])}' "$CSV" | sort
          } >> "$GITHUB_STEP_SUMMARY"

      # The runnable artifact. Not a deployment — nothing is released from here — but it means every green
      # commit on any branch has a jar you could actually run, which is the delivery half of CI/CD.
      - name: Upload application jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: royalty-split-ledger-jar
          path: target/*.jar
          if-no-files-found: error
