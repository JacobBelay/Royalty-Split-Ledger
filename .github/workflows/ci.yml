name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # This GitHub machine already has Docker, which your Testcontainers tests need
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install Java 21 and cache Maven downloads
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Compile and run all tests
      - run: mvn -B verify