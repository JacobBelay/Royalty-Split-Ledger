# Runtime configuration. Values like ${DB_URL:...} read an environment variable and fall back to the
# default after the colon, so the same jar runs locally and in AWS without code changes.
spring:
  application:
    name: royalty-split-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/royalties}
    username: ${DB_USER:royalties}
    password: ${DB_PASSWORD:royalties}
  flyway:
    # Applies src/main/resources/db/migration/V*.sql on startup (see V1__ledger_schema.sql).
    enabled: true

royalty:
  security:
    # HMAC key used to sign and verify JWTs (security/SecurityConfig.java). Must be >= 32 characters:
    # the app refuses to start on a shorter one, because HS256 needs a 256-bit key.
    #
    # The default below is for local development ONLY. It is in version control, so anyone who reads this
    # repository could mint a valid ADMIN token against a server still using it. Always set JWT_SECRET
    # (e.g. `openssl rand -base64 48`) anywhere that is not your own laptop.
    jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-in-production}

    # How long a token stays valid. A JWT cannot be revoked (there is no session to delete), so expiry is
    # the only way one stops working — short is safer, at the cost of signing in more often.
    token-ttl: ${TOKEN_TTL:1h}

    # First-run admin, created by security/AdminBootstrap.java only while app_user is empty.
    bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:admin}

server:
  error:
    # Our GlobalExceptionHandler (api/GlobalExceptionHandler.java) writes RFC 7807 problem JSON;
    # don't leak stack traces to clients.
    include-stacktrace: never
